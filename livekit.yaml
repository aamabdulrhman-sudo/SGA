# إعدادات خادم البث الداخلي (LiveKit) — WebRTC داخل المنصة
port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: true
# المفاتيح يجب أن تطابق LIVEKIT_API_KEY / LIVEKIT_API_SECRET في docker-compose.yml
keys:
  sga-live-key-2026: sga-live-secret-change-me-7f3b9e
